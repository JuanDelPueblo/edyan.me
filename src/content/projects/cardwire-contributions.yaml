description: >-
  Contributed several merged pull requests to Cardwire, an open-source GPU
  manager for Linux that blocks GPUs using eBPF to save power. Built the GUI's
  system tray applet and global settings, and added automatic switching to
  Hybrid mode when an external display is connected to the dedicated GPU.
